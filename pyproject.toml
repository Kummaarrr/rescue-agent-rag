[project]
name = "rescue-rag"
version = "0.1.0"
description = "Taking a RAG prototype to production-grade, with measured before/after metrics."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "tenacity>=9.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "tiktoken>=0.8",
    "anthropic>=2.3",
    "qdrant-client>=1.12",
    "bm25s>=0.2",
    "numpy>=1.26",
    "tqdm>=4.66",
    "voyageai>=0.3",
]

[project.optional-dependencies]
# Installed from Phase 4 (local cross-encoder; pulls in torch)
rerank = ["sentence-transformers>=3.2"]
# Installed from Phase 5/7
agent = ["langgraph>=0.2"]
app = ["streamlit>=1.40"]
ragas = [
    "langchain-community<0.4",
    "ragas>=0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-pyyaml",
    "pre-commit>=4.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: tests that call external services (skipped in CI)"]
addopts = "-m 'not network'"

[tool.mypy]
python_version = "3.12"
packages = ["rescue_rag", "rag_eval"]
mypy_path = "src"
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["RUF001"]
